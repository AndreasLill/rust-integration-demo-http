[package]
name = "rust-integration-demo-http"
version = "0.1.0"
edition = "2024"

[dependencies]
rust-integration-services = { version = "0.5.30", features = ["http", "s3", "file"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize"] }
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
